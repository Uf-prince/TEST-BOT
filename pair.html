<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLD-MD • Pair WhatsApp</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 50%,#16213e 100%); color:#eaeaea; padding:20px; }
  .card { width:100%; max-width:430px; background:rgba(255,255,255,0.04); backdrop-filter:blur(10px);
          border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:34px 28px; text-align:center;
          box-shadow:0 20px 60px rgba(0,0,0,0.5); }
  .logo { font-size:2.4em; margin-bottom:8px; }
  h1 { font-size:1.45em; letter-spacing:1px; margin-bottom:4px; color:#fff; }
  .sub { color:#9aa0b5; font-size:0.85em; margin-bottom:26px; }
  input { width:100%; padding:14px 16px; font-size:1.05em; border-radius:12px; border:1px solid #333;
          background:#11111c; color:#fff; text-align:center; letter-spacing:1px; outline:none; margin:10px 0 14px; }
  input:focus { border-color:#7ee787; }
  button { width:100%; padding:14px; font-size:1em; font-weight:600; border:none; border-radius:12px;
           cursor:pointer; transition:0.2s; }
  .btn-main { background:linear-gradient(90deg,#238636,#2ea043); color:#fff; }
  .btn-main:hover { transform:translateY(-1px); box-shadow:0 8px 24px rgba(46,160,67,0.35); }
  .code-box { margin-top:18px; padding:16px; background:#11111c; border:1px dashed #7ee787;
              border-radius:12px; display:none; }
  .code-label { color:#9aa0b5; font-size:0.75em; letter-spacing:2px; margin-bottom:6px; }
  .code-val { font-size:1.8em; font-weight:700; color:#7ee787; letter-spacing:3px; word-break:break-all; }
  .err-box { margin-top:16px; padding:12px; background:#2a1215; border:1px solid #f8514966;
             border-radius:12px; display:none; color:#ff8080; font-size:0.9em; }
  .status { margin-top:14px; font-size:0.82em; color:#9aa0b5; min-height:20px; }
  .spinner { display:inline-block; width:12px; height:12px; border:2px solid #7ee78730;
             border-top-color:#7ee787; border-radius:50%; animation:spin 1s linear infinite; margin-right:6px; vertical-align:middle; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .note { margin-top:22px; font-size:0.72em; color:#6b7280; line-height:1.5; }
</style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
<div class="card">
  <div class="logo">🔰</div>
  <h1>GOLD-MD PAIRING</h1>
  <div class="sub">Number dalo — code yahin milega</div>

  <input type="tel" id="phone" placeholder="923012345678" autocomplete="off" inputmode="numeric">
  <button class="btn-main" id="goBtn" onclick="startPair()">GENERATE PAIR CODE 🔑</button>

  <div class="code-box" id="codeBox">
    <div class="code-label">YOUR PAIRING CODE</div>
    <div class="code-val" id="codeVal"></div>
    <div style="margin-top:10px;color:#9aa0b5;font-size:0.75em">WhatsApp → Linked Devices → Link with phone number</div>
  </div>
  <div class="err-box" id="errBox"></div>
  <div class="status" id="status"></div>

  <div class="note">Code 2-10 second mein generate hota hai. Page open rakho — code apne aap dikhega.</div>
</div>

<script>
const GIST_RAW = "https://gist.githubusercontent.com/Uf-prince/0d24ea56e9559d94e7318c0c578befdf/raw/paircode.json";
const NTFY_TOPIC = "goldmd-pair-relay";
let pollTimer = null, pollCount = 0;

function digitsOnly(s){ return (s||"").replace(/\D/g,""); }
function st(t, color){ const e=document.getElementById("status"); e.textContent=t; e.style.color=color||"#9aa0b5"; }

async function startPair(){
  const phone = digitsOnly(document.getElementById("phone").value);
  const btn = document.getElementById("goBtn");
  if (phone.length < 10) { st("⚠️ Poora number daalo country code ke saath (923012345678)", "#f0a"); return; }
  btn.disabled = true; btn.textContent = "GENERATING...";
  document.getElementById("codeBox").style.display = "none";
  document.getElementById("errBox").style.display = "none";
  localStorage.setItem("goldmd_pair_phone", phone);
  st("");

  // 1) REQUEST bhejo — ntfy relay (tokenless, CORS-open)
  try {
    const payload = JSON.stringify({ phone: phone, ts: Date.now() });
    await fetch("https://ntfy.sh/" + NTFY_TOPIC, { method: "POST", body: payload });
    st("⏳ Code generate ho raha hai...", "#7ee787");
  } catch (e) {
    btn.disabled = false; btn.textContent = "GENERATE PAIR CODE 🔑";
    st("❌ Network error — phir try karo", "#f85149");
    return;
  }

  // 2) RESULT poll karo — gist se (tokenless anonymous read)
  pollCount = 0;
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    pollCount++;
    if (pollCount > 40) { clearInterval(pollTimer); btn.disabled = false; btn.textContent = "GENERATE PAIR CODE 🔑";
      st("⏰ Timeout — dobara try karo", "#f85149"); return; }
    try {
      const r = await fetch(GIST_RAW + "?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw 0;
      const data = await r.json();
      const e = data[phone];
      if (!e) return;
      if (e.error) {
        clearInterval(pollTimer);
        document.getElementById("errBox").textContent = "❌ " + e.error;
        document.getElementById("errBox").style.display = "block";
        btn.disabled = false; btn.textContent = "GENERATE PAIR CODE 🔑";
        st("");
      } else if (e.code) {
        clearInterval(pollTimer);
        document.getElementById("codeVal").textContent = e.code;
        document.getElementById("codeBox").style.display = "block";
        st("✅ Code ready! WhatsApp mein daalo", "#7ee787");
        btn.disabled = false; btn.textContent = "NAYA CODE 🔁";
      }
    } catch (err) { /* retry next tick */ }
  }, 3000);
}

const saved = localStorage.getItem("goldmd_pair_phone");
if (saved) { document.getElementById("phone").value = saved; }
</script>
</body>
</html>
