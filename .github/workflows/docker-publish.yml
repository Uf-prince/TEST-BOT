# GOLD-MD — Docker image build & push to GHCR
# Image: ghcr.io/uf-prince/gold-md:latest  (+ sha tag, + main tag)
# ClawCloud Run App Launchpad me yehi image use hoti hai.
#
# Runs on: every push to main + manual trigger (Actions tab -> Run workflow)

name: Build & Push Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'todo.md'
      - 'hosting_guide.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # Uf-prince/TEST-BOT -> image: ghcr.io/uf-prince/test-bot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image name (lowercase)
        run: |
          echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
