# ============================================================================
# GOLD-MD — Zerops IMPORT YAML (project + service + autoscaling)
# ============================================================================
# KYA HAI YE FILE: Zerops dashboard me "Import a project" (ya zcli) se ye
# file paste/upload karne se POORA project + service + scaling ek click me
# ban jata hai — GUI me manually kuch set nahi karna padta.
#
# ZEROPS.YAML vs YE FILE: zerops.yaml (repo me) = BUILD/RUN pipeline describe
# karta hai. Ye import YAML = infrastructure (project, service, scaling,
# public subdomain) create karta hai.
#
# DO STEPS:
#   1. Zerops dashboard -> Projects -> "Import a project" -> ye file ka content
#      paste karo -> Create. Project "goldmd-project" + service "goldmd" ban
#      jayega, scaling bhi isi ke sath set ho jayegi (RAM 0.25-1GB, shared
#      CPU, 1 container — bilkul safe, credit ka optimal use).
#   2. Service "goldmd" kholo -> Build & deploy settings -> GitHub repo
#      Uf-prince/TEST-BOT connect karo (PRIVATE repo — GitHub app oauth se
#      connect hota hai, buildFromGit sirf PUBLIC repos ke liye hai) ->
#      pipeline activate.
#   3. Pehla deploy chalega (2-3 min). Phir "Subdomain & domain & IP access"
#      me subdomain already ON milega (enableSubdomainAccess true) ->
#      https://goldmd-xxxx.zerops.app URL se panel kholo -> pair karo.
#
# NOTE: buildFromGit use NAHI kiya (PRIVATE repo hai — docs ke mutabiq
# private repo se buildFromGit FAIL hota hai, GitHub connect sahi rasta hai).
# ============================================================================

project:
  name: goldmd-project
  description: GOLD-MD WhatsApp bot (multi-session, AI commands, 5 users)
  corePackage: LIGHT          # free tier: $65 credit, 100GB egress, 15h build
  tags:
    - goldmd
    - whatsapp-bot

services:
  - hostname: goldmd          # <= 25 chars, lowercase — zerops.yaml setup match
    type: go@1                # Go runtime (binary deploy, compile nahi hota)
    mode: NON_HA              # single container (5 users ke liye kaafi — HA
                              # me 2x resources bill hote)
    enableSubdomainAccess: true   # https://....zerops.app free public URL
    verticalAutoscaling:
      # SHARED CPU — $0.60/core (DEDICATED $6/core se 10x sasta). 5 sessions
      # ka load light hai, shared core kaafi hai. Speed issue pehle bhi
      # shared-contender ki wajah se thi — 1 core min guarantee karta hai.
      minCpu: 1
      maxCpu: 1
      cpuMode: SHARED
      # RAM: 0.25GB se start (bill bhi utna hi) -> 1GB tak spike pe auto
      # scale. 5 sessions x ~60MB = ~300MB normal + libreoffice/ffmpeg spikes
      # = 1GB max bilkul safe. Bot ka apna watchdog 500MB pe cleanup/restart
      # karta hai isliye 1GB cross hona practically impossible.
      minRam: 1
      maxRam: 1
      # Disk: 2GB start (bot ~100-300MB + ffmpeg temp) -> 10GB tak auto scale.
      # Sessions cloud (Storj) pe hain, disk pe sirf binary + temp files.
      minDisk: 2
      maxDisk: 10
      # Thresholds: RAM 85%+ (free < 0.1GB) ya CPU saturated hone pe hi scale
      # — idle me kabhi nahi (bill control).
      minFreeRamGB: 0.1
      minFreeRamPercent: 15
      startCpuCoreCount: 1
    horizontalAutoscaling:
      # EK hi container — 2+ containers = 2 WhatsApp session-DBs = conflict
      # (multi-session bot me horizontal scaling kabhi nahi). Isliye 1-1.
      minContainers: 1
      maxContainers: 1
    zeropsSetup: goldmd        # repo ke zerops.yaml me "goldmd:" setup match
