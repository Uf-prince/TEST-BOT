# ============================================================================
# GOLD-MD — Zerops SERVICE IMPORT YAML (existing "Umar" project me goldmd2)
# ============================================================================
# USAGE: zcli project service-import zerops-import.yaml -P F2WFjaIeRWOa8fmZzMNQ7g
#   -> "Umar" project me NAYA service "goldmd2" banega (naya subdomain URL).
#   -> startWithoutCode: true = container code ke bina start hoga, files
#      LOCAL se `zcli push goldmd2` se aayengi (GitHub connect NAHI).
#   -> enableSubdomainAccess: true = https://goldmd2-xxxx.prg1.zerops.app
# ============================================================================
services:
  - hostname: goldmd2            # <= 25 chars, lowercase; naya naam = naya domain
    type: ubuntu@24.04           # old goldmd service ka same runtime (proven)
    enableSubdomainAccess: true  # public URL panel + /pair + /health ke liye
    startWithoutCode: true       # container abhi start, code zcli push se
    priority: 1
    verticalAutoscaling:
      # SHARED CPU — LIGHT package me cheapest. WhatsApp bot load light hai.
      minCpu: 1
      maxCpu: 1
      cpuMode: SHARED
      # RAM: 1GB cap (10 sessions x ~60MB + ffmpeg/libreoffice spikes —
      # bot watchdog 850/900MB pe khud handle karta hai).
      minRam: 1
      maxRam: 1
      # Disk: 5GB cap — binary + temp media + Storj restore cache kaafi hai.
      minDisk: 1
      maxDisk: 5
      startCpuCoreCount: 1
    horizontalAutoscaling:
      # EK hi container — multi-session bot me 2 containers = 2 session-DBs
      # = conflict. Isliye 1-1 locked.
      minContainers: 1
      maxContainers: 1
